<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f4f31">
<title>Offline · Onward Abeokuta-West</title>
<style>
  :root { color-scheme: light dark; --bg:#f7f2e8; --ink:#14241b; --green:#176b42; --line:#d9d2c1; }
  @media (prefers-color-scheme: dark) { :root { --bg:#000; --ink:#f2f7f3; --green:#4ade80; --line:#2c352f; } }
  html,body { height:100%; margin:0; }
  body { display:flex; align-items:center; justify-content:center; padding:24px; box-sizing:border-box;
         background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:360px; text-align:center; }
  img { width:72px; height:72px; border-radius:18px; }
  h1 { margin:20px 0 8px; font-size:1.25rem; color:var(--green); }
  p { margin:0 0 20px; line-height:1.5; opacity:.8; font-size:.95rem; }
  button { font:inherit; font-weight:600; padding:10px 22px; border-radius:999px; border:0; cursor:pointer;
           background:var(--green); color:var(--bg); }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>You're offline</h1>
  <p>Onward Abeokuta-West needs an internet connection to show your society's records. Check your connection and try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
